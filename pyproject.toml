[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-inference"
version = "0.1.0"
description = "Choice API for Hugging Face causal language models, locally or on Modal"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
inference = ["torch>=2.4,<3", "transformers>=4.51,<5", "accelerate>=1,<2"]
modal = ["modal>=1,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
jev-inference = "jev_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".cache", ".venv*", ".codex", ".agents", "src/jev_inference/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.package-data]
"jev_inference._vendor.jevbench" = ["LICENSE"]
